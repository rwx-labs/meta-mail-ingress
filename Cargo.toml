[package]
name = "meta-mail-ingress"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.12"
async-trait = "0.1.88"
aws-config = { version = "1.4.0", default-features = false, features = ["client-hyper", "rustls", "rt-tokio"] }
aws-sdk-s3 = "1.29.0"
axum = { version = "0.8.1", features = ["macros"] }
axum-login = "0.17.0"
base64 = "0.22.1"
bytesize = "2.0.1"
clap = { version = "4.5.4", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
humantime-serde = "1.1.1"
listenfd = "1.0.1"
mail-parser = "0.10.2"
miette = { version = "7.2.0", features = ["fancy"] }
openidconnect = { version = "4.0.0", features = ["accept-rfc3339-timestamps"] }
opentelemetry = "0.29.0"
opentelemetry-otlp = { version = "0.29.0", features = ["grpc-tonic"] }
opentelemetry-resource-detectors = { version = "0.7.0", git = "https://github.com/open-telemetry/opentelemetry-rust-contrib" }
opentelemetry-semantic-conventions = "0.29.0"
opentelemetry_sdk = { version = "0.29.0", features = ["rt-tokio"] }
reqwest = { version = "0.12.4", features = ["json"] }
serde = { version = "1.0.199", features = ["derive"] }
serde_json = "1.0.117"
sha2 = { version = "0.10.8", features = ["asm"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "time"] }
tempfile = "3.10.1"
thiserror = "2.0.12"
time = "0.3.41"
tokio = { version = "1.37.0", features = ["full"] }
tower-http = { version = "0.6.1", features = ["fs", "trace", "compression-full"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tracing = "0.1.40"
tracing-opentelemetry = { version = "0.30.0", features = ["thiserror"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
tree_magic_mini = { version = "3.1.4", features = ["with-gpl-data"] }
url = { version = "2.5.0", features = ["serde"] }

[profile.release]
lto = "fat"
strip = "debuginfo"
panic = "abort"
opt-level = "z"
codegen-units = 1
